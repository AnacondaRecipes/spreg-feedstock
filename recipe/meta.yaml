{% set name = "spreg" %}
{% set version = "1.9.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 0633a13383700b79a197664db300bfc1b14c4747d770aa961c4f40c7a7577179

build:
  number: 0
  skip: true  # [py<312]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - setuptools >=61.0
    - setuptools_scm >=6.2
    - toml
    - wheel
  run:
    - python
    - libpysal >=4.12
    - numpy >=2.0.0
    - pandas >=2.3
    - scikit-learn >=1.5
    - scipy >=1.14
  run_constrained:
    # Extra plus
    - geopandas >=1.1
    - matplotlib >=3.10
    - numba >=0.60

test:
  imports:
    - spreg
  requires:
    - pip
    - pytest
    - geopandas
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest --pyargs spreg

about:
  home: https://github.com/pysal/spreg
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: PySAL Spatial Econometrics Package
  description: |
    spreg, short for “spatial regression,” is a Python package to estimate
    simultaneous autoregressive spatial regression models. These models are
    useful when modeling processes where observations interact with one another.
    This package is part of a refactoring of PySAL.
  dev_url: https://github.com/pysal/spreg
  doc_url: https://github.com/pysal/spreg/blob/master/README.md

extra:
  recipe-maintainers:
    - ocefpaf
    - pedrovma
    - jGaboardi
