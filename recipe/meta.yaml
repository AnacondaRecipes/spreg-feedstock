{% set name = "spreg" %}
{% set version = "1.9.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 0633a13383700b79a197664db300bfc1b14c4747d770aa961c4f40c7a7577179

build:
  number: 0
  # increase min python version to 310, where in which we are able to use
  # libpysal version >=4.8. More info in libpysal comment.
  skip: true  # [py<312]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - setuptools >=61.0
    - setuptools_scm >=6.2
    - toml
    - setuptools-scm >=6.2
  run:
    - python
    # introduce upper bound:
    # spreg/tests/test_sputils.py::Test_Sparse_Utils::test_multiply - AssertionError: <Compressed Sparse Row sparse matrix of dtype 'float64'
    - libpysal >=4.12
    - numpy >=2.0.0
    - pandas >=2.3
    - scikit-learn >=1.5
    - scipy >=1.14
  run_constrained:
    - geopandas >=1.1
    - matplotlib-base >=3.10
    - numba >=0.60

test:
  imports:
    - spreg
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest --pyargs spreg
  requires:
    - pip
    - pytest
    - geopandas

about:
  home: https://github.com/pysal/spreg
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: PySAL Spatial Econometrics Package
  description: |
    spreg, short for “spatial regression,” is a Python package to estimate
    simultaneous autoregressive spatial regression models. These models are
    useful when modeling processes where observations interact with one another.
    This package is part of a refactoring of PySAL.
  dev_url: https://github.com/pysal/spreg
  doc_url: https://github.com/pysal/spreg/blob/master/README.md

extra:
  recipe-maintainers:
    - ocefpaf
    - pedrovma
    - jGaboardi

<conda_recipe_manager.types.SentinelType object at 0x7f97d5666270>:  # with 7 stored elements and shape (20, 20)> is not an instance of <class 'scipy.sparse._csc.csc_matrix'>
  - scipy >=0.11,<1.16  # [py<314]
  - scipy >=0.11  # [py>=314]
  # https://github.com/pysal/spreg/issues/191
  # Error: TypeError: only 0-dimensional arrays can be converted to Python scalars.
  - numpy >=1.23,<=2.3.5
  - pandas
  # upstream pins to 4.0.0; increase min bound to 4.8.0 where graphs APIs (used
  # by this package) was introduced to libpysal
  - libpysal >=4.8.0  #  [py>=310]
  - scikit-learn >=0.22
